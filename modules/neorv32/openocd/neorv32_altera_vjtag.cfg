# OpenOCD configuration: NEORV32 on-chip debugger via Altera virtual JTAG (SLD hub)
#
# Requires the Altera OpenOCD fork shipped with Quartus (tested: Quartus 23,
# Open On-Chip Debugger 0.11.0-R22.4) - it talks to the Quartus JTAG server
# (jtagd) through the "aji_client" adapter and supports "vjtag create".
# The gateware must use modules/neorv32/src/hdl/neorv32_debug_dtm_altera_sld.vhd.
#
# Usage (example, cable on a remote jtagd reachable as 127.0.0.1:13090):
#   openocd -c 'set CABLE {USB-BlasterII on 127.0.0.1:13090 [1-6]}' \
#           -f modules/neorv32/openocd/neorv32_altera_vjtag.cfg
#
# JTAG clock: the SLD hub was not found at the USB-Blaster II default of 24 MHz on
# pexarria380 (ribbon + Promo12 adapter); 6 MHz works. The clock is a jtagd cable
# parameter (aji_client cannot set it):
#   jtagconfig --setparam "USB-BlasterII [1-6]" JtagClock 6M
# Check: "jtagconfig -n" must list "Node 00406E00 (110:8) #0".
#
# Variables (optional, set with -c before -f):
#   CABLE    jtagd cable name as printed by jtagconfig (needed if more than one cable)
#   CHIPNAME name of the FPGA TAP (default: arriav)
#   FPGA_ID  IDCODE of the FPGA (default: 0x02a010dd, Arria V 5AGXMA3D4)
#   PRE_TAPS  list of {name irlen idcode} declared before the FPGA TAP
#   POST_TAPS list of {name irlen idcode} declared after the FPGA TAP
#             other devices in the chain, in the order jtagconfig lists them.
#             pexp (tested 2026-11-20): -c 'set PRE_TAPS {{cpld 8 0x06e5d093}}'
#             (CoolRunner-II before the FPGA; without it the SLD node is not found).
#             "Cannot activate tap #0 ... don't know what type it is" for the CPLD is harmless.
#   VJTAG_ID SLD node id of the DTM's sld_virtual_jtag (default: 0x00406e00 =
#            node type 0x08, mfg 0x06e, instance index 0; another SLD node such as
#            SignalTap can shift the instance index)

adapter driver aji_client

if { [info exists CABLE] } {
  aji_client hardware cable0 $CABLE
}

if { [info exists CHIPNAME] } { set _CHIPNAME $CHIPNAME } else { set _CHIPNAME arriav }
if { [info exists FPGA_ID] }  { set _FPGA_ID $FPGA_ID }   else { set _FPGA_ID 0x02a010dd }
if { [info exists VJTAG_ID] } { set _VJTAG_ID $VJTAG_ID } else { set _VJTAG_ID 0x00406e00 }

if { [info exists PRE_TAPS] } {
  foreach t $PRE_TAPS {
    lassign $t _n _ir _id
    jtag newtap $_n tap -irlen $_ir -expected-id $_id
  }
}

# physical FPGA TAP (10 bit IR on Arria V)
jtag newtap $_CHIPNAME tap -irlen 10 -expected-id $_FPGA_ID

if { [info exists POST_TAPS] } {
  foreach t $POST_TAPS {
    lassign $t _n _ir _id
    jtag newtap $_n tap -irlen $_ir -expected-id $_id
  }
}

# NEORV32 DTM behind the SLD hub (sld_virtual_jtag inside neorv32_debug_dtm)
vjtag create $_CHIPNAME.tap.neorv32 -chain-position $_CHIPNAME.tap -expected-id $_VJTAG_ID

set _TARGETNAME $_CHIPNAME.neorv32
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.tap.neorv32

# tunnelled JTAG over a network jtagd is slow - be generous
riscv set_command_timeout_sec 30
riscv set_reset_timeout_sec 30

# expose NEORV32-specific CSR mxisa (0xfc0, shows up as "csr4032");
# this OpenOCD 0.11 does not support the "4032=mxisa" naming syntax
riscv expose_csrs 4032

init
